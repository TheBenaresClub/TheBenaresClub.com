<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio | Club Benares</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="./media/A00 Logo - Light.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-laboratorio">

  <!-- Header container where JavaScript will insert the header -->
  <div id="header-container"></div>

  <main>
    <div class="computer-container">
      <iframe 
        src="vista.html" 
        class="os-simulation"
        title="Vista Operating System Simulation"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <footer>
    <div class="copyright">
      &copy; 2025 Club Benares. Todos os direitos reservados.
    </div>
    <div class="social-icons">
      <a href="https://www.instagram.com/thebenaresclub" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="mailto:charlie@thebenaresclub.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
    </div>
  </footer>

  <!-- Load shared header -->
  <script src="shared-header.js"></script>

  <style>
    .computer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      padding: 2rem;
      background-image: url('./media/monitor.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .os-simulation {
      width: 1600px;
      height: 900px;
      border: none;
      filter: grayscale(100%);
      background: #000;
    }

    body {
      filter: grayscale(100%);
    }

    @media (max-width: 1700px) {
      .os-simulation {
        width: 1280px;
        height: 720px;
      }
    }

    @media (max-width: 1400px) {
      .os-simulation {
        width: 1024px;
        height: 576px;
      }
    }

    @media (max-width: 1100px) {
      .os-simulation {
        width: 90vw;
        height: calc(90vw * 9 / 16);
        max-width: 1024px;
        max-height: 576px;
      }
      
      .computer-container {
        padding: 1rem;
      }
    }
  </style>

</body>
</html>
